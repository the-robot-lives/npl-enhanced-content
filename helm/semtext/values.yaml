replicas: 1

# Google Analytics 4 measurement id (e.g. "G-XXXXXXXXXX"). Empty disables
# analytics entirely: the container serves index.html with no gtag script.
gaMeasurementId: ""
domain: semtext.dev

# Additional ingress hosts sharing the same service and TLS secret. The origin
# cert SANs are semtext.dev + *.semtext.dev, so any subdomain here is covered.
extraHosts:
  - www.semtext.dev
frontend:
  # CI owns this line. It is deliberately a flat single-line string: the
  # bump-chart job in .github/workflows/ci.yml seds this exact shape.
  # Never hand-edit it for a release.
  image: ops.noizu.com/semtext.dev/web:sha-fd4a166
  port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
imagePullSecrets:
  - name: ops-registry-secret
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true
tls:
  enabled: true
  secretName: semtext-dev-tls
  infisical:
    enabled: true
    resyncInterval: 300
    hostAPI: https://infisical.noizu.com/api
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/semtext"
    crtKey: SEMTEXT_TLS_CRT
    keyKey: SEMTEXT_TLS_KEY
